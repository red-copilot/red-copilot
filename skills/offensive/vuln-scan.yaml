apiVersion: harness/skill/v1
id: discovery.vuln-scan
domain: web
description: Automated vulnerability scanning — injection, SSRF, auth bypass, and deserialization.
tags: [discovery, vuln, sqli, xss, ssrf, injection]

requires:
  - kind: observation
    type: web.endpoint
    minimum_trust: claim

produces:
  - kind: hypothesis
    type: web.vulnerability
  - kind: observation
    type: web.finding

cost: 0.4
risk: 0.3
noise: 0.4

