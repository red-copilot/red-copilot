apiVersion: harness/skill/v1
id: benchmark.flag-candidate-verification
domain: benchmark
description: Confirm a candidate flag by submitting it to the platform and reading authoritative feedback.
tags: [flag, submission, verification]

requires:
  - kind: artifact
    type: flag.candidate
    minimum_trust: claim

produces:
  - kind: observation
    type: flag.verified
    minimum_trust: verified

cost: 0.1
risk: 0.1
noise: 0.1
