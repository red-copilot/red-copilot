apiVersion: harness/skill/v1
id: service.credential-access
domain: network
description: Use a discovered service with known or default credentials to obtain access.
tags: [access, credentials, service]

requires:
  - kind: entity
    type: network.service
    minimum_trust: evidence
  - kind: capability
    type: network.reachability
    minimum_trust: verified

produces:
  - kind: capability
    type: service.access
  - kind: artifact
    type: credential

cost: 0.4
risk: 0.5
noise: 0.4
