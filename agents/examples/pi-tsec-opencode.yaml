apiVersion: harness/v1
id: pi-tsec-opencode
type: pi
image: harness/pi-kali:local
network: host
network_profile: benchmark-only
env: {}
pi:
  provider: opencode-go
  model: longcat-2.5-preview-free
  # RPC keeps the control loop closed: Harness delivers the objective via
  # `prompt` and injects verification/plan/world feedback via `steer`. The
  # one-shot `json` mode only wrote feedback to a file the Agent never read.
  mode: rpc
  thinking: medium
  tools:
    - read
    - bash
    - edit
    - write
  system_prompt_file: prompts/tsec-solver.md
  env_passthrough:
    - OPENCODE_API_KEY
  # Kali's nmap binary carries file capabilities
  # (cap_net_bind_service,cap_net_admin,cap_net_raw): every one of them must be
  # in the container's bounding set or the exec itself fails with EPERM.
  cap_add:
    - NET_RAW
    - NET_ADMIN
    - NET_BIND_SERVICE
  approve_project: false
  context_files: false
  extensions: false
  skills: false
  prompt_templates: false
  themes: false
  mcp: false
  offline: true
  # RUN-06: the Harness context extension clamps one bash call to 180s and spills
  # oversized tool output, which the 2026-10-16 sweep needed (19 calls over 180s,
  # longest 927s of an 1800s window). Only the competition configs opt in.
  harness_extension: true
