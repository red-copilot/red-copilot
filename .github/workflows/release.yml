name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Validate release tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match pyproject.toml version $VERSION" >&2
            exit 1
          }
      - run: ruff check .
      - run: pytest -q
      - name: Build Python distributions
        run: python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
