name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install Python verifier sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.4
      - run: pi --version
      - run: python -m pip install -e ".[dev]"
      - name: enforce harness namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "redharness",
              "REDHARNESS_",
              ".redharness",
              "rh_pi_",
              '"harness.world/',
              '"harness.progress/',
          )
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path == Path(".github/workflows/ci.yml"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}: {token}")
          if violations:
              raise SystemExit(
                  "legacy or non-standard harness namespace detected:\n"
                  + "\n".join(violations)
              )
          PY
      - run: ruff check .
      - run: docker build -t harness-isolation-probe:ci agents/examples/isolation-probe
      - run: pytest tests/test_container_boundary.py tests/test_network_profiles_docker.py -q
      - run: pytest -q
      - run: harness validate benchmarks/examples/hello/task.yaml
      - run: harness validate benchmarks/examples/zc-hackathon/task.yaml
      - run: harness preflight benchmarks/examples/hello/task.yaml --agent agents/examples/demo.yaml
      - run: harness validate benchmarks/examples/hello-docker-verifier/task.yaml
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi.yaml'); assert a.type == 'pi'"
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi-tsec.yaml'); assert a.type == 'pi' and a.network == 'host'"
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi-tsec-hackathon.yaml'); assert a.pi.system_prompt_file == 'prompts/tsec-solver.md'"
      - run: harness tsec --help
      - run: harness gateway --help
      - run: harness capabilities
      - run: harness run benchmarks/examples/hello/task.yaml --agent agents/examples/demo.yaml --allow-host-agent --seed 7
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/gateway-demo.yaml
          --allow-host-agent
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 11
      - run: docker build -t harness-gateway-demo:ci agents/examples/docker-gateway
      - run: docker build -t harness-verifier:ci benchmarks/examples/hello-docker-verifier
      - run: docker build -f docker/gateway/Dockerfile -t harness-gateway:ci .
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 12
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-mode sidecar
          --gateway-image harness-gateway:ci
          --gateway-policy examples/gateway-policy.yaml
          --seed 14
      - run: >-
          harness run benchmarks/examples/hello-docker-verifier/task.yaml
          --agent agents/examples/demo.yaml
          --allow-host-agent
          --seed 13
