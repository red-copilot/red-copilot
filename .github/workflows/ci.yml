name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install Python verifier sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e ".[dev]"
      - name: enforce harness namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "redharness",
              "REDHARNESS_",
              ".redharness",
              "rh_pi_",
              '"harness.world/',
              '"harness.progress/',
          )
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path == Path(".github/workflows/ci.yml"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}: {token}")
          if violations:
              raise SystemExit(
                  "legacy or non-standard harness namespace detected:\n"
                  + "\n".join(violations)
              )
          PY
      - run: ruff check .
      - run: docker build -t harness-isolation-probe:ci agents/examples/isolation-probe
      - run: docker build -t harness-pi-rpc:ci tests/fixtures/pi-rpc
      - run: docker build -t harness-verifier:ci benchmarks/examples/hello-docker-verifier
      - run: pytest tests/test_container_boundary.py tests/test_network_profiles_docker.py -q
      - run: pytest -q
      - run: harness validate benchmarks/examples/hello/task.yaml
      - run: harness validate benchmarks/examples/zc-hackathon/task.yaml
      - run: harness validate benchmarks/examples/hello-docker-verifier/task.yaml
      - run: harness preflight benchmarks/examples/hello/task.yaml --agent tests/fixtures/pi-rpc/agent.yaml
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi.yaml'); assert a.image and a.pi"
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi-tsec.yaml'); assert a.network == 'host'"
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi-tsec-hackathon.yaml'); assert a.pi.system_prompt_file == 'prompts/tsec-solver.md'"
      - run: harness tsec --help
      - run: harness gateway --help
      - run: harness capabilities
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent tests/fixtures/pi-rpc/agent.yaml
          --runs-root .harness/ci-runs
          --seed 7
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent tests/fixtures/pi-rpc/agent-gateway.yaml
          --runs-root .harness/ci-runs
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 11
      - run: >-
          harness run benchmarks/examples/hello-docker-verifier/task.yaml
          --agent tests/fixtures/pi-rpc/agent.yaml
          --runs-root .harness/ci-runs
          --seed 13
      - name: subagent container smoke
        run: |
          mkdir -p "$RUNNER_TEMP/subagent-work"
          printf 'fixture\n' > "$RUNNER_TEMP/subagent-work/input.txt"
          harness subagent \
            --agent tests/fixtures/pi-rpc/agent.yaml \
            --objective "inspect input.txt" \
            --timeout 30 \
            --workdir "$RUNNER_TEMP/subagent-work"
          test "$(cat "$RUNNER_TEMP/subagent-work/.fake-pi-touched")" = "subagent-ok"
