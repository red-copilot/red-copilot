# Proxychains template for tools that cannot speak SOCKS themselves.
# Point the last line at whatever local port your tunnel exposes
# (VShell socks5 tunnel, chisel R:socks, ssh -D, ...).
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
[ProxyList]
socks5 127.0.0.1 1080
