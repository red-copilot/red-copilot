[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "red-harness"
version = "0.8.0"
description = "Reproducible evaluation runtime for security agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
tsec = [
  "tsec-benchmark>=0.1.2,<0.2",
]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
harness = "harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "src/spike_swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=harness --cov-branch --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["harness"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "BLE", "T20"]

[tool.ruff.lint.per-file-ignores]
# Verifier scripts and test fixtures print protocol output to stdout/stderr.
"benchmarks/examples/**/verifier.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/fixtures/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
